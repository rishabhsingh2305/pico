AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  picoservice

  A Go API Lambda behind a public Function URL, plus a scheduled link analytics
  Lambda, both built from the same binary.

Parameters:
  MongoDBURI:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string.
  MongoDBDatabase:
    Type: String
    Default: picoservice
    Description: MongoDB database name.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign email verification tokens.
  PublicBaseURL:
    Type: String
    Description: Public base URL used to build verification links.
  ShortBaseURL:
    Type: String
    Default: ""
    Description: Public origin for short links, for example https://link.uppixl.com. Must be set with BunnyApiKey.
  BunnyApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Bunny.net API key used to purge cached short-link redirects and read analytics logs. Must be set with ShortBaseURL.
  BunnyPullZoneId:
    Type: String
    Default: ""
    Description: Bunny pull zone ID used by the link analytics job. Leave empty to disable the scheduled job.
  CorsAllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated allowed CORS origins. Defaults to PublicBaseURL when empty. Use * to allow all.
  EmailFrom:
    Type: String
    Description: Sender address for verification emails.
  SmtpAddr:
    Type: String
    Description: SMTP server address (host:port).
  SmtpUsername:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional SMTP username.
  SmtpPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional SMTP password.

Conditions:
  AnalyticsEnabled: !And
    - !Not [!Equals [!Ref BunnyPullZoneId, ""]]
    - !Not [!Equals [!Ref BunnyApiKey, ""]]
    - !Not [!Equals [!Ref ShortBaseURL, ""]]

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: provided.al2023
    Architectures:
      - x86_64

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./
      Handler: bootstrap
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDBURI
          MONGODB_DATABASE: !Ref MongoDBDatabase
          JWT_SECRET: !Ref JwtSecret
          PUBLIC_BASE_URL: !Ref PublicBaseURL
          SHORT_BASE_URL: !Ref ShortBaseURL
          BUNNY_API_KEY: !Ref BunnyApiKey
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          EMAIL_FROM: !Ref EmailFrom
          SMTP_ADDR: !Ref SmtpAddr
          SMTP_USERNAME: !Ref SmtpUsername
          SMTP_PASSWORD: !Ref SmtpPassword
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Condition: AnalyticsEnabled
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./
      Handler: bootstrap
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          APP_MODE: analytics
          MONGODB_URI: !Ref MongoDBURI
          MONGODB_DATABASE: !Ref MongoDBDatabase
          BUNNY_API_KEY: !Ref BunnyApiKey
          BUNNY_PULL_ZONE_ID: !Ref BunnyPullZoneId
          SHORT_BASE_URL: !Ref ShortBaseURL
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)

Outputs:
  FunctionUrl:
    Description: Public Lambda Function URL
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  ApiFunction:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
  ApiFunctionIamRole:
    Description: Implicit IAM role ARN
    Value: !GetAtt ApiFunctionRole.Arn
  AnalyticsFunction:
    Condition: AnalyticsEnabled
    Description: Scheduled link analytics Lambda ARN
    Value: !GetAtt AnalyticsFunction.Arn
