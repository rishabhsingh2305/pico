# Feature role policy. Each feature declares roles and the unit permissions
# granted by each role. Role names in access tokens are "<feature>.<role>", for
# example "expense.editor".
#
# Rules validated at startup:
#   - only the org, member, project, expense, link, and share features are allowed
#   - viewer is required; editor and admin are optional
#   - viewer permissions must be a subset of editor and admin
#   - editor permissions must be a subset of admin
#   - every org-scope route permission must be granted by at least one role
#
# The organization owner is implicit: token issuance writes "*" and the owner
# must not be declared here.
features:
  org:
    viewer: [orgs.get]
    admin: [orgs.get, orgs.update]

  member:
    viewer: [members.list]
    admin: [members.list, members.add, members.update, members.remove]

  share:
    viewer: [shares.list, shares.status, shares.credentials]
    admin: [shares.list, shares.status, shares.credentials, shares.create, shares.revoke]

  link:
    viewer: [links.list, links.get, links.stats]
    editor: [links.list, links.get, links.stats, links.create, links.update]
    admin: [links.list, links.get, links.stats, links.create, links.update, links.delete]

  analytics:
    viewer: [analytics.list, analytics.get, analytics.stats, analytics.bulk_stats]
    editor: [analytics.list, analytics.get, analytics.stats, analytics.bulk_stats, analytics.create, analytics.update]
    admin: [analytics.list, analytics.get, analytics.stats, analytics.bulk_stats, analytics.create, analytics.update, analytics.delete]

  project:
    viewer: [projects.list, projects.get]
    editor: [projects.list, projects.get, projects.create, projects.update]
    admin: [projects.list, projects.get, projects.create, projects.update]

  expense:
    viewer: [expenses.list, expenses.summary, expenses.get]
    editor: [expenses.list, expenses.summary, expenses.get, expenses.create, expenses.update]
    admin: [expenses.list, expenses.summary, expenses.get, expenses.create, expenses.update, expenses.delete]
